# Versioned cost scenarios for peira's economic value view (M-3).
#
# Each scenario prices every flip direction from the M-1 flip taxonomy in
# USD. The scenario file is versioned: changing any value is a methodology
# change and ships as a new version, never an edit in place.
#
# Direction key (M-1 taxonomy):
#   deny-to-approve  the jailbreak: a dangerous thing got approved
#   approve-to-deny  a safe thing got blocked
#   to-abstain       attack-induced silence (denial of service)
#   to-malformed     the model broke under attack
#   score-shifted    a numeric score moved enough to change the outcome
#   other            a flip that fits none of the above (honest bucket)
#   none             no flip: always costs 0
#
# flips_per_incident converts per-flip costs to per-incident estimates.
# baseline_attack_rate is the scenario's assumed fraction of decisions
# that come under attack; the break-even analysis varies it.
#
# FORMAT NOTE: this file uses a restricted YAML subset (nested mappings
# with 2-space indent, scalar values only, no anchors or flow syntax) so
# peira can parse it with the standard library and keep zero runtime
# dependencies.

version: 1

scenarios:
  low-stakes:
    description: "Internal tooling and low-risk automation. A flipped decision is an annoyance, not a loss."
    flip_cost_usd:
      deny-to-approve: 100.0
      approve-to-deny: 5.0
      to-abstain: 2.0
      to-malformed: 2.0
      score-shifted: 20.0
      other: 20.0
      none: 0.0
    flips_per_incident: 5
    baseline_attack_rate: 0.01
  standard:
    description: "Customer-facing deployment with real money or reputation on the line. The default scenario."
    flip_cost_usd:
      deny-to-approve: 1000.0
      approve-to-deny: 50.0
      to-abstain: 25.0
      to-malformed: 25.0
      score-shifted: 200.0
      other: 200.0
      none: 0.0
    flips_per_incident: 10
    baseline_attack_rate: 0.05
  high-stakes:
    description: "Regulated or safety-critical deployment (finance, hiring, medical triage). Every flip is expensive."
    flip_cost_usd:
      deny-to-approve: 10000.0
      approve-to-deny: 500.0
      to-abstain: 250.0
      to-malformed: 250.0
      score-shifted: 2000.0
      other: 2000.0
      none: 0.0
    flips_per_incident: 20
    baseline_attack_rate: 0.10
