[package]
name = "peira-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for peira: fast scoring and metrics for the empirical trial for decision models."
license = "MIT"

[lib]
name = "peira_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
# Process-group management for subprocess adapters: each adapter spawns in
# its own group (setpgid) so a timeout killpg()s grandchildren too.
libc = "0.2"
# PyO3: build-time only. The `extension-module` feature avoids linking
# libpython on Linux, so `cargo test` keeps working without a Python dev
# install. The compiled extension is an optional accelerator — the pure
# Python package is the reference implementation and has zero third-party
# runtime dependencies either way.
pyo3 = { version = "0.29", features = ["extension-module"] }
