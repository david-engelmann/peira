[package]
name = "peira-core"
version = "0.1.0"
edition = "2021"
description = "Benchmarking decision models under attack, starting with Jev, Shieldstral, Prompt Guard 2 and SemIf. 2,000 paired cases; 95% confidence intervals on every number."
license = "MIT"

[lib]
name = "peira_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ryu = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
