[package]
name = "peira-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for peira: fast scoring and metrics for the empirical trial for decision models."
license = "MIT"

[lib]
name = "peira_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ryu = "1"

[dev-dependencies]
tempfile = "3"
