[package]
name = "peira-cli"
version = "0.1.0"
edition = "2021"
description = "peira CLI: the empirical trial for decision models (Rust binary)."
license = "MIT"

[[bin]]
name = "peira"
path = "src/main.rs"

[dependencies]
peira-core = { path = "../peira-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
# SIGINT handler for Ctrl-C checkpointing (Unix).
libc = "0.2"
