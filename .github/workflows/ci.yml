name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only checks out code.
permissions:
  contents: read

# Cancel superseded runs on the same ref; a newer push makes the older run's
# result meaningless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_runner:
    # Picks the runner pool for all Linux jobs: David's self-hosted
    # runner-grid when online (no queue wait), else GitHub-hosted.
    # Fork PRs NEVER use self-hosted (untrusted code on David's laptop).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read  # to check runner status
    outputs:
      runner: ${{ steps.final.outputs.runner }}
    steps:
      - name: Check if runner-grid is online
        id: fallback
        # Skip the API check for fork PRs; they stay on GitHub-hosted.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: mikehardy/runner-fallback-action@v1
        with:
          primary-runner: "self-hosted,runner-grid"
          fallback-runner: "ubuntu-latest"
          primaries-required: 1
          fallback-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set runner output
        id: final
        run: |
          if [ -n "${{ steps.fallback.outputs.use-runner }}" ]; then
            # Convert the action's output to a JSON array for fromJSON().
            # The action may output "self-hosted,runner-grid" (comma-separated)
            # or '["ubuntu-latest"]' (already JSON).
            runner='${{ steps.fallback.outputs.use-runner }}'
            if [[ "$runner" == "["* ]]; then
              echo "runner=$runner" >> "$GITHUB_OUTPUT"
            else
              json=$(python3 -c "import json,sys; print(json.dumps([s.strip() for s in '''$runner'''.split(',')]))")
              echo "runner=$json" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
  lockfile:
    # uv.lock must stay in sync with pyproject.toml. uv is installed
    # via pip (no new action needed); `uv lock --check` runs offline
    # against the committed lockfile and fails the PR when it is stale.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv lock --check
  public-surface:
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_public_surface.py

  docs:
    # Internal links rot silently; this fails the build on dead ones.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_doc_links.py
      # No em dashes in public Markdown; they are the #1 AI-writing tell.
      - run: python3 scripts/check_no_emdashes.py
      # McNemar p-values must never attach to weighted metrics (C-2).
      - run: python3 scripts/check_no_weighted_mcnemar.py
      # docs/CLI.md is generated from the live parser; fail on drift.
      - run: python3 scripts/gen_cli_reference.py --check docs/CLI.md
      # The family registry and docs/Taxonomy.md must never drift.
      - run: python3 scripts/check_families.py
      # Notes tier-words must match severity; scale wording must match 0-1 convention (A4).
      - run: python3 scripts/check_notes_tier_words.py
      # Docs pins of the Trial manifest version must match
      # dataset/trial/manifest.json (PR #201 missed one).
      - run: python3 scripts/check_trial_version_pins.py

  coderabbit-config:
    # CodeRabbit is advisory step 0: it must never block merges. This job
    # fails the build if .coderabbit.yaml stops parsing, flips
    # request_changes_workflow on, or sneaks in an error-mode pre-merge check.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_coderabbit_config.py

  site:
    # The leaderboard scaffold must stay buildable and correct: install
    # deps, ingest the mock artifacts through the real pipeline, run the
    # Astro static build, then run the JSDOM test suite (site.test.js,
    # site-views.test.js, site-methodology.test.js) against the source.
    # Real-data ingestion is a manual pre-launch step.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site

  dco:
    # Contributing.md requires Signed-off-by trailers (DCO); enforce it
    # mechanically on every non-merge commit in the PR. Push-to-main runs
    # are the already-gated squash result, so the PR is the enforcement point.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: require Signed-off-by on every PR commit
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          count=0
          for sha in $(git rev-list --no-merges "$base..$head"); do
            count=$((count + 1))
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Every commit needs a 'Signed-off-by: Name <email>' trailer (git commit -s)."
            exit 1
          fi
          echo "DCO sign-off present on all $count PR commit(s)."

  dataset-version:
    # Contributing.md item 5: dataset case changes must bump the dataset
    # version and add a CHANGELOG entry. Diff-based and mechanical; the
    # script no-ops when no case files changed.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: require version bump + CHANGELOG entry for dataset changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_dataset_version_bump.py "$BASE_SHA"

  dataset-tags:
    # R-10: the immutable tag registry (data/dataset-releases.json) is
    # the source of truth for dataset releases. Every entry is verified
    # against the git object store: the tag must resolve, must still
    # point at the recorded commit (tags are never moved), and the
    # manifest/croissant bytes at the tag must hash to the recorded
    # digests. History must be complete for tag resolution.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: verify the dataset-release tag registry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The registry is append-only: entries present at the merge
        # base must be byte-identical now, so a PR cannot silently
        # rewrite history. The merge base (not the base branch head)
        # is the correct comparison point: main may have moved forward
        # since the PR branched. On non-PR runs the base check is
        # skipped.
        run: |
          if [ -n "$BASE_SHA" ]; then
            MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
            python3 scripts/check_dataset_tags.py --check-append-only "$MERGE_BASE"
          else
            python3 scripts/check_dataset_tags.py
          fi

  disposition-drift:
    # A11a: docs/audit-dispositions.md + .json are generated from
    # scripts/generate_audit_dispositions.py. Re-run the generator and
    # fail on any drift, so the committed record cannot silently
    # diverge from its canonical source. Full history is needed for
    # the generator's evidence-SHA reachability checks.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: regenerate disposition matrix and fail on drift
        run: |
          python3 scripts/generate_audit_dispositions.py
          git diff --exit-code docs/audit-dispositions.md docs/audit-dispositions.json

  lint-rust:
    # The Rust migration is active; CI must catch a skipped local gate.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy, rustfmt
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  test-python:
    # Pure-Python fallback leg: maturin builds the extension at install
    # time (the Rust toolchain step is load-bearing even though the
    # suite then runs with PEIRA_NO_RUST=1), so this job covers the
    # fallback backend on a fresh checkout. test-python-rust covers the
    # compiled backend.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: pip install -e .[dev]
      # tests/integration is owned by the dedicated test-integration job.
      - run: PEIRA_NO_RUST=1 python -m pytest tests -n auto --ignore=tests/integration

  test-hf-tokenizers:
    # T-P1-2: the real-tokenizer contracts in test_hf_adapters.py need
    # transformers installed; without this lane they would skip everywhere
    # and never execute. Tokenizer files only (no model weights or GPU).
    # The grep asserts zero skips: a lane that silently skips is the same
    # dishonesty in a new place. Deliberate tradeoff: this lane downloads
    # from the HF Hub, so a Hub outage fails the job by design (the
    # contract tests skip locally without network, keeping local runs
    # green; CI is the lane that must not lie about having run them).
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The maturin PEP 517 backend builds the extension at install time,
      # so the Rust toolchain is required even for these contract tests.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: pip install -e .[hf]
      - run: pip install -e .[dev]
      - run: |
          # The summary grep asserts zero skips: a partially-skipped contract
          # (e.g. "1 passed, 1 skipped") must fail, not silently pass.
          # pytest pads its summary line with "=" ("==== 2 passed, 1 warning
          # in 5.84s ===="), so the match must anchor on that padding, not
          # on line start: a "^[0-9]+" anchor never matches and fails the
          # job even when every test passes.
          out=$(python -m pytest tests/test_hf_adapters.py::TestRealTokenizerContract 2>&1)
          echo "$out"
          summary=$(echo "$out" | grep -E "=+ [0-9]+ (passed|failed|error|skipped)" || true)
          if ! echo "$summary" | grep -qE "[0-9]+ passed"; then
            echo "contract tests did not all run"; exit 1
          fi
          if echo "$summary" | grep -qE "[0-9]+ (failed|error|skipped)"; then
            echo "contract tests failed, errored, or skipped"; exit 1
          fi

  test-rust:
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: cargo test --workspace

  test-python-rust:
    # The optional PyO3 accelerator: build peira._core in release profile
    # via the maturin backend and run the Python suite against the Rust
    # backend, then again with PEIRA_NO_RUST=1 to prove the pure-Python
    # fallback. (test-python covers the fallback with the extension
    # built but disabled; this job covers the compiled backend.)
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      # Exactly one release-profile extension build. MATURIN_PEP517_ARGS
      # cannot be used: pip forwards it to `maturin pep517 write-dist-info`,
      # which rejects --release in maturin 1.x. Instead, create a venv,
      # install via pip, then rebuild the extension in release via maturin
      # develop (which requires an active virtualenv). maturin must be
      # installed into the venv first: --no-build-isolation means pip
      # uses the venv's packages for the build backend.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install "maturin>=1,<2"
      # maturin's PEP 517 hooks shell out to the `maturin` binary, so
      # .venv/bin must be on PATH for the build below (otherwise pip
      # fails with FileNotFoundError: 'maturin').
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: .venv/bin/pip install --no-build-isolation -e '.[dev]'
      - run: .venv/bin/maturin develop --release
      - run: .venv/bin/python -c "from peira._rust import RUST_AVAILABLE; assert RUST_AVAILABLE"
      # tests/integration is owned by the dedicated test-integration
      # job (own timeout, own visibility); the main suite excludes it
      # so the integration layer runs exactly once per backend.
      - run: .venv/bin/python -m pytest tests -n auto --ignore=tests/integration
      - run: PEIRA_NO_RUST=1 .venv/bin/python -m pytest tests -n auto --ignore=tests/integration

  test-integration:
    # The integration layer: dataset -> runner -> metrics -> artifact ->
    # report end to end on real case samples, in both backends. Kept as
    # its own job (not folded into test-python-rust) so a pipeline-level
    # regression is visible at a glance, and so the job can carry its
    # own time budget: the suite must finish in minutes, not tens of
    # minutes.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      # Same release-profile extension build as test-python-rust:
      # MATURIN_PEP517_ARGS cannot be used (pip forwards it to
      # `maturin pep517 write-dist-info`, which rejects --release in
      # maturin 1.x), so install via pip then rebuild in release via
      # maturin develop in an active virtualenv. maturin must be
      # installed into the venv first: --no-build-isolation means pip
      # uses the venv's packages for the build backend.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install "maturin>=1,<2"
      # maturin's PEP 517 hooks shell out to the `maturin` binary, so
      # .venv/bin must be on PATH for the build below (otherwise pip
      # fails with FileNotFoundError: 'maturin').
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: .venv/bin/pip install --no-build-isolation -e '.[dev]'
      - run: .venv/bin/maturin develop --release
      - run: .venv/bin/python -c "from peira._rust import RUST_AVAILABLE; assert RUST_AVAILABLE"
      - run: .venv/bin/python -m pytest tests/integration -n auto -q
      - run: PEIRA_NO_RUST=1 .venv/bin/python -m pytest tests/integration -n auto -q

  quickstart:
    # The README quickstart must work verbatim, offline, on every PR.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The maturin PEP 517 backend builds the extension at install time.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: pip install -e .
      # The README's `peira run` step: exit 3 = ran fine but
      # ranking-ineligible (the 100-case Trial sits below the 200-case /
      # per-family floors). Assert it — don't swallow other failures.
      - run: peira run --adapter mock --suite trial --seed 0 --out runs || [ $? -eq 3 ]
        shell: bash
      - run: peira report --run runs/mock-trial.json --out report.html
      # The README's table one-liner (the "Trial in action" numbers are
      # generated, never hand-edited).
      - run: python3 scripts/gen_readme_table.py runs/mock-trial.json

  readme-table:
    # The README "Trial in action" table is generated, never hand-edited:
    # this job fails if the committed copy drifts from generator output.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The maturin PEP 517 backend builds the extension at install time.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: pip install -e .
      - name: regenerate the sample table and diff it against the README
        shell: bash
        run: |
          peira run --adapter mock --suite trial --seed 0 --out /tmp/readme-table || [ $? -eq 3 ]
          python3 scripts/check_readme_table.py README.md /tmp/readme-table/mock-trial.json

  dataset-checks:
    # The authoring pipeline's release seal, enforced in CI: the Trial
    # starter suite must pass all six validation gates and its committed
    # manifest must match its case files, so a dataset mismatch is a
    # build failure. trial-demo is scaffolding and stays exempt (no
    # gates, no manifest). dataset/v1 grows incrementally, so both
    # checks run there only once there is something to check.
    needs: check_runner
    runs-on: ${{ fromJSON(needs.check_runner.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - run: pip install -e .
      - run: peira dataset gates --dir dataset/trial
      - run: peira dataset verify-manifest --dir dataset/trial
      - run: cargo run -q -p peira-cli -- validate --dir dataset/trial
      - name: gates on dataset/v1 (when cases exist)
        shell: bash
        run: |
          if compgen -G "dataset/v1/cases/*.jsonl" > /dev/null; then
            peira dataset gates --dir dataset/v1/cases
          elif compgen -G "dataset/v1/*.jsonl" > /dev/null; then
            peira dataset gates --dir dataset/v1
          else
            echo "no case files in dataset/v1 yet — skipping gates"
          fi
      - name: verify manifest on dataset/v1 (when present)
        shell: bash
        run: |
          if [ -f dataset/v1/cases/manifest.json ]; then
            peira dataset verify-manifest --dir dataset/v1/cases
          else
            echo "no manifest.json in dataset/v1/cases yet — skipping verify"
          fi
      - name: gates and manifest on dataset/safety-policy (when present)
        shell: bash
        run: |
          if compgen -G "dataset/safety-policy/cases/*.jsonl" > /dev/null; then
            peira dataset gates --dir dataset/safety-policy/cases
          fi
          if [ -f dataset/safety-policy/cases/manifest.json ]; then
            peira dataset verify-manifest --dir dataset/safety-policy/cases
          else
            echo "no manifest.json in dataset/safety-policy/cases yet — skipping verify"
          fi
