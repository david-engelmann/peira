name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_surface.py

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover tests -v

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  test-python-rust:
    # The optional PyO3 accelerator: build peira._core and run the Python
    # suite against the Rust backend, then again with PEIRA_NO_RUST=1 to
    # prove the pure-Python fallback. (test-python covers the fallback on
    # a fresh checkout, where the extension is never built.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e .
      - run: python scripts/build_core_ext.py
      - run: python -c "from peira._rust import RUST_AVAILABLE; assert RUST_AVAILABLE"
      - run: python -m unittest discover tests -v
      - run: PEIRA_NO_RUST=1 python -m unittest discover tests

  quickstart:
    # The README quickstart must work verbatim, offline, on every PR.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: peira run --adapter mock --suite trial-demo --dry-run
      # Exit 3 = ran fine but ranking-ineligible (the 12-case demo never
      # clears the 200-case / per-family floors); that is expected here.
      - run: peira run --adapter mock --suite trial-demo --out runs || [ $? -eq 3 ]
        shell: bash
      - run: peira validate --dataset dataset/trial-demo
      - run: peira report --run runs/mock-trial-demo.json --out report.html
