name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_surface.py

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -v
        # Full suite: 190+ tests (unittest discover only found 16).

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --check

  cli-parity:
    # Cross-implementation: Python-sealed artifacts verify with Rust CLI
    # and vice versa. The strongest parity guarantee.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e . pytest
      - run: cargo build --locked -p peira-cli
      - run: python -m pytest tests/test_cli_parity.py -v

  quickstart:
    # The README quickstart must work verbatim, offline, on every PR.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: peira run --adapter mock --suite trial-demo --dry-run
      # Exit 3 = ran fine but ranking-ineligible (the 12-case demo never
      # clears the 200-case / per-family floors); that is expected here.
      - run: peira run --adapter mock --suite trial-demo --out runs || [ $? -eq 3 ]
        shell: bash
      - run: peira validate --dataset dataset/trial-demo
      - run: peira report --run runs/mock-trial-demo.json --out report.html
