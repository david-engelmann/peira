version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /site
      - /site/board
    schedule:
      interval: weekly
    groups:
      site-updates:
        applies-to: version-updates
        patterns: ["*"]
      site-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-updates:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
