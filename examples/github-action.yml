# Copy-paste CI regression workflow: benchmark your model on every PR.
#
# Drop this file into your own repo's .github/workflows/ to get a peira
# regression gate: if your adapter's ASR moves, you'll see it in the PR.

name: peira-regression

on: [push, pull_request]

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install peira
      # Replace --adapter mock with your adapter and --suite trial-demo
      # with --suite trial once the v1 dataset ships.
      - run: peira run --adapter mock --suite trial-demo --out runs --json-progress
      - run: peira report --run runs/mock-trial-demo.json --out report.html
      - uses: actions/upload-artifact@v4
        with:
          name: peira-report
          path: report.html
