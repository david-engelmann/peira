# CodeRabbit review settings. Schema: https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is advisory step 0: its comments are addressed before the three-review
# gate, but it is not a required check. See docs/Contributing.md
# "What happens after you open a PR".
#
# REFINEMENTS (2026-09-29, from the effectiveness research over PRs #155-#191):
#  R1. Global review priorities (input validation, docs-code drift, test quality,
#      minimal-fix preference) documented here; the YAML schema has no
#      `reviews.instructions` key, so set them in the dashboard's Custom
#      Instructions. Path instructions below encode the same priorities.
#  R2. Added scripts/audit_* + scripts/check_* path instruction: canary GUIDs are
#      intentional detection markers, not secrets (kills CWE-200 false positives).
#  R3. Excluded generated docs/CLI.md from review (CI fails on drift).
#  R4. Fixed: added test-hf-tokenizers to CI job list; removed dangling
#      research-note reference; copy bar bans colons/semicolons too.
#  R5. (2026-09-29, effectiveness research over PRs #155-#191, 109 findings):
#      added check_runner to the CI job list (was unnamed and unprotected);
#      tightened both copy-bar instructions after CodeRabbit suggested a colon
#      as an em-dash replacement on #182 (colons are banned too): never suggest
#      a colon or semicolon as the replacement, restructure into short sentences.
#      (A tests/** pytest update was drafted as R7 but reverted in review: the
#      migration has not landed, CI still runs unittest discover.)
#  R6. (2026-09-29): docs/Contributing.md "What happens after you open a PR"
#      rewritten to describe the real flow (CodeRabbit advisory step 0, then the
#      three-review gate); the knowledge base points CodeRabbit at that section,
#      and the old text described a flow that does not exist.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be direct and technical. Be constructive with outside contributors. No flattery, no filler."

reviews:
  profile: "chill"  # house standard per maidan #1067; escalate only if signal justifies it
  request_changes_workflow: false  # advisory step 0: CodeRabbit never blocks merges
  # Peira squash-merges, so the summary goes in the walkthrough comment instead of
  # being written into the PR description (which becomes the squash commit body).
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  suggested_reviewers: false  # agent-driven workflow; suggestions are noise
  review_status: true

  # NOTE: CodeRabbit's YAML schema has no `reviews.instructions` key for global
  # review guidance (verified against schema.v2.json 2026-09-29). Global priorities
  # (input validation first, docs-code drift second, test quality third, minimal
  # fixes preferred, no re-raise of dispositioned findings unless code changed)
  # must be set via the CodeRabbit dashboard's Custom Instructions. The
  # path_instructions below encode the same priorities per path.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0  # never pause; agent PRs routinely exceed 5 commits (repairs, DCO fixes)
    base_branches:
      - ".*"  # stacked PRs use lane branches as base; "main" alone would skip them
    ignore_title_keywords:
      - "wip"

  path_filters:
    # Keep reviews focused on human-authored sources; CI already covers the rest.
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/target/**"
    - "!dataset/**/*.jsonl"  # large generated case files; validated by schema CI, not by prose review
    - "!docs/CLI.md"  # generated from the live parser; CI fails on drift, do not suggest edits

  path_instructions:
    - path: "docs/**"
      instructions: |
        These are public docs held to a human-engineer voice standard:
        - NEVER use em dashes (U+2014) in prose. Restructure the sentence instead.
        - No colons or semicolons in public copy either. Short plain sentences.
        - When flagging an em dash, NEVER suggest a colon or semicolon as the
          replacement. Suggest restructuring into short plain sentences.
        - No AI-writing tells: no "delve", "moreover", "in today's fast-paced", no emoji.
        - A sentence about what peira does must be backed by a row in docs/Claims.md;
          flag "95% CIs on every number", performance numbers, or adapter claims without
          a backing row or benchmark behind them.
        - Every CLI command, flag, and error string shown must be runnable against the
          actual CLI. Check that internal doc links resolve to real files/anchors.
        - Prefer short, plain sentences.
    - path: "**/*.md"
      instructions: |
        No em dashes (U+2014) in prose. When flagging one, never suggest a colon
        or semicolon as the replacement. Suggest short plain sentences instead.
        No unbacked claims about what peira does
        (backing rows live in docs/Claims.md). README.md, CLAUDE.md and
        docs/Contributing.md must agree on the PR flow described in
        docs/Contributing.md "What happens after you open a PR" and the required CI checks.
    - path: "python/peira/**"
      instructions: |
        Peira is pre-1.0 blank-canvas: flag backwards-compatibility shims, deprecated
        aliases, and "kept for compatibility" code paths; renames and deletions are
        made outright. Comments explain a non-obvious why and do not restate code.
        Performance paths dispatch to Rust via PyO3 with a pure-Python fallback gated
        on PEIRA_NO_RUST=1; both paths must stay behaviorally identical. Flag any new
        public function/class without a docstring; flag changed public behavior
        without a docs/ update.
    - path: "tests/**"
      instructions: |
        Tests use unittest.TestCase (python -m unittest discover tests), NOT pytest.
        Every new test must assert behavior (expected vs actual). Flag tests that only
        exercise code without assertions, or that assert on tautologies.
        Tests must be deterministic: no network, no wall-clock dependence, no paid API calls.
    - path: "crates/**"
      instructions: |
        Rust code must be clippy-clean under the workspace lints (warnings denied in CI).
        No .unwrap()/.expect() outside #[cfg(test)] code; propagate errors.
        Any new #[pyfunction]/#[pymethods] surface needs a Python-side fallback or an
        explicit PEIRA_NO_RUST=1 test proving graceful degradation.
    - path: ".github/workflows/**"
      instructions: |
        The required CI checks are check_runner, coderabbit-config, public-surface, docs, dco, dataset-version,
        lint-rust, test-python, test-hf-tokenizers, test-rust, test-python-rust,
        quickstart, readme-table, dataset-checks. Flag any rename or removal of
        these job names. Minimal permissions per job, no unpinned third-party
        actions, no secrets in logs.
    - path: "scripts/**"
      instructions: |
        Shell scripts must be shellcheck-clean and must not write outside the repo
        or /tmp without a reason stated in the PR description or a code comment.
    # R2: Canary/GUID scripts. The canary GUID is an intentional detection marker:
    # its entire purpose is to be searchable in training corpora. Flagging canary
    # handling as "sensitive data exposure" (CWE-200) is a category error.
    - path: "scripts/audit_*"
      instructions: |
        These scripts handle canary GUIDs and holdout fingerprints. Canary GUIDs are
        INTENTIONAL detection markers, not secrets: do not flag their presence in
        code, logs, or test fixtures as sensitive-data exposure. Do flag: real
        credentials, private holdout case content leaving the repo, or network
        exfiltration. The security scanner's CWE-200 findings on canary handling
        are false positives; do not repeat them.
    - path: "scripts/check_*"
      instructions: |
        Same canary rule as scripts/audit_*: canary GUIDs are detection markers,
        not secrets. Do not raise sensitive-data findings on canary handling.

  pre_merge_checks:
    # Everything stays at warning: CodeRabbit advises, the three-review gate decides.
    # Doc comments are written where the why is not obvious, not to a quota.
    docstrings:
      mode: "off"
    title:
      mode: "warning"
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    # Custom checks deferred until CodeRabbit Pro grant is confirmed.
    # Without Pro, custom checks are silently inert. To enable: confirm Pro
    # in dashboard, then add checks for (1) em-dash scan, (2) Claims.md backing,
    # (3) CLI reference drift.

  tools:
    languagetool: { enabled: false }  # fights our human-voice docs standard; noisy
    vale: { enabled: false }          # no checked-in Vale config; would be noise

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "docs/Contributing.md"
      - "**/AGENTS.md"
  learnings:
    scope: "local"
    approval_delay: 7  # veto window against learnings poisoning (P2-R1)
  linked_repositories: []  # never link private companion repos

chat:
  auto_reply: false  # avoid agent rebuttal reply loops (P2-R2)
