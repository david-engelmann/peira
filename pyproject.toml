[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "peira"
# NB: the repo ALWAYS carries 0.0.0. The signed git release tag (vX.Y.Z)
# is the single source of truth; scripts/release/stamp.py stamps the tag
# version into build trees at publish time. See docs/Release.md.
version = "0.0.0"
description = "An open-source AI safety stress-test and intelligence hub for leading models and guardrails, including Jev, ChatGPT, Claude, DeepSeek, Kimi, Gemini, Llama Prompt Guard 2, Grok, GLM, WildGuard, ShieldGemma, Granite Guardian and Shieldstral."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Engelmann" }]
keywords = ["benchmark", "llm-evaluation", "adversarial-robustness", "decision-models"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Optional: Hugging Face guardrail adapters (python/peira/adapters/hf.py).
# transformers is capped below v5: the v5 major (Jan 2026) removed the
# TF/JAX backends, refactored dynamic weight loading and tokenization,
# shipped new typer-based CLIs, and dropped legacy env vars (the hub
# client moved from requests to httpx in huggingface_hub v1.0), and the
# adapters are unverified against it. Lift the cap only after verifying
# the pinned revisions load and score identically under v5.
hf = ["transformers>=4.40,<5", "torch>=2.2"]
# Optional: structured-output LLM baseline adapters
# (python/peira/adapters/llm.py).
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.77.0"]
google = ["google-genai>=1.0"]
all = ["peira[hf]", "peira[openai]", "peira[anthropic]", "peira[google]"]
# Development and test tooling. The Python suite runs under pytest
# (unittest.TestCase classes are discovered natively); pytest-xdist
# parallelizes it across workers and pytest-timeout guards against hangs.
# maturin is the PEP 517 build backend (PyO3 extension); it is also needed
# directly in the venv for `maturin develop` (fast incremental rebuilds).
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-timeout>=2", "hypothesis>=6.100", "maturin>=1,<2"]

[project.scripts]
peira = "peira.cli:main"

[project.urls]
Homepage = "https://github.com/david-engelmann/peira"
Documentation = "https://github.com/david-engelmann/peira/tree/main/docs"
Repository = "https://github.com/david-engelmann/peira"

[tool.maturin]
# PyO3 extension module: crates/peira-python builds `peira._core`.
bindings = "pyo3"
python-source = "python"
module-name = "peira._core"
manifest-path = "crates/peira-python/Cargo.toml"
# Stable-ABI wheels: one wheel per platform covers all supported Pythons.
# These features apply to every maturin invocation (build, develop, and
# PEP 517 installs): abi3 constrains the PyO3 API used, so `cargo test` /
# `cargo bench` (which do not go through maturin) keep working against
# the full (non-abi3) API.
features = ["pyo3/abi3-py310"]
# Wheels ship optimized; local editable installs stay fast debug builds.
profile = "release"
editable-profile = "dev"
# Runtime data files shipped inside the wheel and sdist.
include = [
  { path = "python/peira/data/*.json", format = ["sdist", "wheel"] },
  { path = "python/peira/data/cost_scenarios/*.yaml", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
# The suite is unittest.TestCase-based; pytest discovers it natively.
# Parallelize with `pytest -n auto` (CI does this). A per-test timeout
# guards against hangs; thread mode avoids SIGALRM-handler conflicts and
# works under xdist workers.
testpaths = ["tests"]
addopts = ["--tb=short"]
timeout = 900
timeout_method = "thread"
