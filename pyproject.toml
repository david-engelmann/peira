[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peira"
version = "0.1.0"
description = "The empirical trial for decision models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Engelmann" }]
keywords = ["benchmark", "llm-evaluation", "adversarial-robustness", "decision-models"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Reserved for future adapters; no adapter code uses these yet.
hf = ["transformers>=4.40", "torch", "huggingface-hub>=0.22"]
all = ["peira[hf]"]

[project.scripts]
peira = "peira.cli:main"

[project.urls]
Homepage = "https://github.com/david-engelmann/peira"
Documentation = "https://github.com/david-engelmann/peira/tree/main/docs"
Repository = "https://github.com/david-engelmann/peira"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
peira = ["data/*.json"]
