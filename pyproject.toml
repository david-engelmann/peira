[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peira"
version = "0.1.0"
description = "An open-source AI safety stress-test and intelligence hub for leading models and guardrails, including Jev, ChatGPT, Claude, DeepSeek, Kimi, Gemini, Llama Prompt Guard 2, Grok, GLM, WildGuard, ShieldGemma, Granite Guardian and Shieldstral."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Engelmann" }]
keywords = ["benchmark", "llm-evaluation", "adversarial-robustness", "decision-models"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Optional: Hugging Face guardrail adapters (python/peira/adapters/hf.py).
# transformers is capped below v5: the v5 major (Jan 2026) removed the
# TF/JAX backends, refactored dynamic weight loading and tokenization,
# shipped new typer-based CLIs, and dropped legacy env vars (the hub
# client moved from requests to httpx in huggingface_hub v1.0), and the
# adapters are unverified against it. Lift the cap only after verifying
# the pinned revisions load and score identically under v5.
hf = ["transformers>=4.40,<5", "torch>=2.2"]
# Optional: structured-output LLM baseline adapters
# (python/peira/adapters/llm.py).
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.77.0"]
google = ["google-genai>=1.0"]
all = ["peira[hf]", "peira[openai]", "peira[anthropic]", "peira[google]"]
# Development and test tooling. The Python suite runs under pytest
# (unittest.TestCase classes are discovered natively); pytest-xdist
# parallelizes it across workers and pytest-timeout guards against hangs.
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-timeout>=2"]

[project.scripts]
peira = "peira.cli:main"

# P-4 adapter plugin registry. First-party adapters register under the
# same `peira.adapters` group third-party distributions use, so
# `peira adapter list` shows one registry. The entry-point name is the
# registry id and MUST equal the adapter's `name` attribute (the
# name-vs-attribute binding in peira.adapters.discovery fails the load
# closed otherwise). Dotted-path loading keeps working unchanged.
[project.entry-points."peira.adapters"]
shieldstral = "peira.adapters.hf:ShieldstralAdapter"
protectai-prompt-injection = "peira.adapters.hf:ProtectAIAdapter"
llama-prompt-guard-2 = "peira.adapters.hf:LlamaPromptGuard2Adapter"
qwen3guard-gen = "peira.adapters.hf:Qwen3GuardAdapter"
granite-guardian = "peira.adapters.hf:GraniteGuardianAdapter"
shieldgemma = "peira.adapters.hf:ShieldGemmaAdapter"
wildguard = "peira.adapters.hf:WildGuardAdapter"
harmbench = "peira.adapters.hf:HarmBenchAdapter"
granite-guardian-hap = "peira.adapters.hf:GraniteGuardianHapAdapter"
azure-prompt-shields = "peira.adapters.azure_prompt_shields:AzurePromptShieldsAdapter"
cloudflare-workers-ai = "peira.adapters.cloudflare_workers_ai:CloudflareWorkersAiAdapter"
jev = "peira.adapters.jev:JevAdapter"
local-systemone = "peira.adapters.kev:LocalSystemOneAdapter"
kev = "peira.adapters.kev:KevAdapter"
lakera = "peira.adapters.lakera:LakeraAdapter"
laya = "peira.adapters.laya:LayaAdapter"
openai-structured = "peira.adapters.llm:OpenAIAdapter"
moonshot-structured = "peira.adapters.llm:MoonshotAdapter"
xai-structured = "peira.adapters.llm:XAIAdapter"
deepseek-structured = "peira.adapters.llm:DeepSeekAdapter"
meta-structured = "peira.adapters.llm:MetaLlamaAdapter"
zai-structured = "peira.adapters.llm:ZaiAdapter"
mistral-structured = "peira.adapters.llm:MistralAdapter"
qwen-structured = "peira.adapters.llm:QwenAdapter"
openrouter-structured = "peira.adapters.llm:OpenRouterAdapter"
anthropic-structured = "peira.adapters.llm:AnthropicAdapter"
google-structured = "peira.adapters.llm:GoogleAdapter"
model-armor = "peira.adapters.model_armor:ModelArmorAdapter"
openai-moderation = "peira.adapters.omni_moderation:OmniModerationAdapter"
openjev-sglang = "peira.adapters.openjev_sglang:OpenJevSglangAdapter"
semif = "peira.adapters.semif:SemifAdapter"

[project.urls]
Homepage = "https://github.com/david-engelmann/peira"
Documentation = "https://github.com/david-engelmann/peira/tree/main/docs"
Repository = "https://github.com/david-engelmann/peira"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
peira = ["data/*.json", "data/cost_scenarios/*.yaml"]

[tool.pytest.ini_options]
# The suite is unittest.TestCase-based; pytest discovers it natively.
# Parallelize with `pytest -n auto` (CI does this). A per-test timeout
# guards against hangs; thread mode avoids SIGALRM-handler conflicts and
# works under xdist workers.
testpaths = ["tests"]
addopts = ["--tb=short"]
timeout = 900
timeout_method = "thread"
